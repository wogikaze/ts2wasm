# Task runner: same commands as `scripts/manager.py` (single entry, no need to read each script first).
# Install: https://mise.jdx.dev  —  then: `mise tasks` / `mise run <task>`
# No mise? Use: `python scripts/manager.py` or `python scripts/manager.py help`
# Note: On Windows, use python scripts/manager.py instead of scripts/manager (bash)

# Default must stay lightweight and argument-free. Without this, `mise run`
# attempts every task, including long reference/test262 and arg-required gates.
[tasks.default]
description = "Default smoke check: no reference corpus or argument-required gates"
run = "python scripts/manager.py check"

[tasks.check]
description = "Smoke check by default; pass a part name for one check (example: mise run check issues)"
run = "python scripts/manager.py check"

[tasks.gate]
description = "Standard gate: fmt + issues + architecture + coverage matrix check + nextest"
run = "python scripts/manager.py gate"

[tasks."gate-fast"]
description = "Fast gate: standard gate without nextest"
run = "python scripts/manager.py gate-fast"

[tasks."gate-all"]
description = "Full gate: harness/toolchain baseline plus project gates"
run = "python scripts/manager.py gate-all"

# Use Python manager for cross-platform support
[tasks."check-scripts"]
description = "Bash -n on scripts/**/*.sh (syntax only)"
hide = true
run = "python scripts/manager.py check-scripts"

[tasks."check-issue-index"]
description = "Compatibility alias for check-issue-health"
hide = true
run = "python scripts/manager.py check-issue-index"

[tasks."update-issue-index"]
description = "Regenerate issues/index.md (pass --check to verify only)"
run = "python scripts/manager.py update-issue-index"

[tasks."gen-issues-from-coverage"]
description = "Generate issues from reference-coverage --detail output (args: --suite test262)"
run = "python scripts/manager.py gen-issues-from-coverage"

[tasks."install-hooks"]
description = "Enable .githooks (fmt, markdown, issues) via core.hooksPath"
run = "python scripts/manager.py install-hooks"

[tasks."link-reference"]
description = "Symlink ignored reference/ corpus into worktrees"
run = "python scripts/manager.py link-reference"

[tasks."check-coverage-gate"]
description = "Compare two coverage matrix documents (see script for args)"
hide = true
run = "python scripts/manager.py check-coverage-gate"

[tasks."update-coverage-matrix"]
description = "Refresh reference coverage table (see script for args)"
run = "python scripts/manager.py update-coverage-matrix"

[tasks."reference-coverage"]
description = "Run reference-based coverage (see script for args)"
run = "python scripts/manager.py reference-coverage"

[tasks."reference-coverage-fast-20"]
description = "Run ~20% of reference coverage cases (tsc/tsgo) without semantic checks"
run = "python scripts/manager.py reference-coverage tsc --detail --no-semantic --no-server --limit 1284 && python scripts/manager.py reference-coverage tsgo --detail --no-semantic --no-server --limit 33"

[tasks."reference-triage"]
description = "Generate rich diagnostics for one reference test path"
run = "python scripts/manager.py reference-triage"

[tasks."coverage-to-issues"]
description = "Run coverage and auto-generate issues (args: --suite test262, --limit N)"
run = "python scripts/manager.py coverage-to-issues"

[tasks."abc451-runtime-costs"]
description = "Run default-off ABC451 depth-8 runtime cost diagnostic"
run = "python scripts/manager.py abc451-runtime-costs"

[tasks."repo-metrics"]
description = "Repository line, byte, and content-kind metrics"
run = "python scripts/manager.py repo-metrics"

[tasks."coverage-report"]
description = "Generate language coverage report from language-reference (args: --format text|markdown)"
run = "python scripts/manager.py coverage-report"

[tasks."coverage-dashboard-data"]
description = "Generate coverage dashboard JSON (default: site/docs/coverage/web-ui/public/data, or TS2WASM_DOCS_REPO_PATH override)"
run = "python scripts/manager.py coverage-dashboard-data"

[tasks."build-dashboard-site"]
description = "Build web-ui dashboard bundle and publish it to /dashboard/ in the docs output root"
run = "python scripts/build-dashboard-site.py"

[tasks."sync-docs-site"]
description = "Sync generated docs, coverage matrix, dashboard assets, and dashboard data to external TS2WASM_DOCS_REPO_PATH"
run = "python scripts/sync-docs-site.py"

[tasks."discord-report"]
description = "Send or validate a Discord cycle report payload"
run = "python scripts/manager.py discord-report"

[tasks.benchmark-tracker]
description = "Append build/fixture performance metrics to JSON"
run = "python scripts/manager.py benchmark-tracker"

[tasks.test262]
description = "Alias for 'reference-coverage test262 --jsonl' (detailed JSONL output)"
run = "python scripts/manager.py reference-coverage test262 --jsonl"

[tasks."test-differential-reporter"]
description = "HTML/Md report from test262 JSONL (stdin; optional file args)"
run = "python scripts/manager.py test-differential-reporter"

[tasks."test-regression-gate"]
description = "Gate: JSONL result vs baseline"
run = "python scripts/manager.py test-regression-gate"

[tasks.fmt]
description = "cargo fmt --all --check"
run = "python scripts/manager.py fmt"

[tasks.clippy]
description = "cargo clippy --all-targets -- -D warnings"
run = "python scripts/manager.py clippy"

[tasks.nextest]
description = "cargo nextest run (default project test entry)"
run = "python scripts/manager.py nextest"

[tasks."check-repo-smoke"]
description = "Compatibility alias for check"
hide = true
run = "python scripts/manager.py check-repo-smoke"

[tasks."check-fast-gate"]
description = "Compatibility alias for gate"
hide = true
run = "python scripts/manager.py gate"

[tasks."check-manifest-imports"]
description = "Manifest JSON imports vs wasm import section"
hide = true
run = "python scripts/manager.py check-manifest-imports"

[tasks."check-fixture-catalog"]
description = "fixtures/ top-level layout rules"
hide = true
run = "python scripts/manager.py check-fixture-catalog"

[tasks."check-architecture-rules"]
description = "Crate boundary smoke and file-size errors"
hide = true
run = "python scripts/manager.py check-architecture-rules"

[tasks."check-compiler-diagnostics"]
description = "No panic! in backend/runtime/main.rs"
hide = true
run = "python scripts/manager.py check-compiler-diagnostics"

[tasks."check-harness-installation"]
description = "Compatibility alias for gate-all"
hide = true
run = "python scripts/manager.py check-harness-installation"

[tasks."check-toolchain"]
description = "Verify required CLI tools (cargo, node, wasm-tools, …)"
hide = true
run = "python scripts/manager.py check-toolchain"

[tasks."check-host-deny"]
description = "Standalone fixtures must not import wasm module name host"
hide = true
run = "python scripts/manager.py check-host-deny"

[tasks."check-runtimefn-invariants"]
description = "Unit tests for runtime link plan and RuntimeFn invariants"
hide = true
run = "python scripts/manager.py check-runtimefn-invariants"

[tasks."check-wasm-validation"]
description = "wasm-tools validate on representative build outputs"
hide = true
run = "python scripts/manager.py check-wasm-validation"

[tasks."check-agent-state"]
description = "Validate .agents/state JSON files against schemas"
hide = true
run = "python scripts/manager.py check-agent-state"

[tasks."check-issue-health"]
description = "Mechanical invariants: ids, paths, index+tables"
hide = true
run = "python scripts/manager.py check-issue-health"

[tasks."check-issue-readiness"]
description = "Score open issues for actionability and measurement quality"
hide = true
run = "python scripts/manager.py check-issue-readiness -- --warn-size-band M --fail-size-band L"

[tasks."check-test-records-schema"]
description = "Validate TestRecord JSONL lines (stdin or file)"
hide = true
run = "python scripts/manager.py check-test-records-schema"

[tasks."check-fixture-differential"]
description = "Node vs iwasm: runs nextest m2_node_diff"
hide = true
run = "python scripts/manager.py check-fixture-differential"

[tasks.manager]
description = "Print script manager help (list all commands)"
run = "python scripts/manager.py help"

[tasks."gen-site"]
description = "Generate documentation site content from docs/issues/fixtures"
run = "python scripts/gen-site.py"

[tasks."build-site"]
description = "Build documentation site (generates content then builds)"
run = "python scripts/gen-site.py && python scripts/build-dashboard-site.py && cd site && npm run build"

[tasks."serve-site"]
description = "Serve documentation site locally for development"
run = "python scripts/gen-site.py && python scripts/build-dashboard-site.py && cd site && npm run dev"


[tasks."dev-loop"]
description = "Autonomous compiler development loop driver: status, advance, reset, check"
run = "scripts/dev/dev-loop.sh"
