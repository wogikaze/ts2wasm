# Task runner: same commands as `scripts/manager` (single entry, no need to read each .sh first).
# Install: https://mise.jdx.dev  —  then: `mise tasks` / `mise run <task>`
# No mise? Use: `scripts/manager` or `scripts/manager help`

[tasks."check-scripts"]
description = "Bash -n on scripts/*.sh (syntax only)"
run = "scripts/manager check-scripts"

[tasks."check-issue-index"]
description = "Fail if issues/index.md is stale or queue tables are wrong"
run = "scripts/manager check-issue-index"

[tasks."check-issue-queue"]
description = "Mechanical invariants: issue ids, paths, index + Ready/Blocked tables"
run = "scripts/manager check-issue-queue"

[tasks."update-issue-index"]
description = "Regenerate issues/index.md (pass -- --check to verify only)"
run = "scripts/manager update-issue-index"

[tasks."install-hooks"]
description = "Enable .githooks (fmt, markdown, issues) via core.hooksPath"
run = "scripts/manager install-hooks"

[tasks."check-coverage-gate"]
description = "Compare two coverage matrix documents (see script for args)"
run = "scripts/manager check-coverage-gate"

[tasks."update-coverage-matrix"]
description = "Refresh reference coverage table (see script for args)"
run = "scripts/manager update-coverage-matrix"

[tasks."reference-coverage"]
description = "Run reference-based coverage (see script for args)"
run = "scripts/manager reference-coverage"

[tasks.benchmark-tracker]
description = "Append build/fixture performance metrics to JSON"
run = "scripts/manager benchmark-tracker"

[tasks.test262]
description = "test262 harness: JSONL on stdout (see script for args)"
run = "scripts/manager test262"

[tasks."test-differential-reporter"]
description = "HTML/Md report from test262 JSONL (stdin; optional file args)"
run = "scripts/manager test-differential-reporter"

[tasks."test-regression-gate"]
description = "Gate: JSONL result vs baseline"
run = "scripts/manager test-regression-gate"

[tasks.fmt]
description = "cargo fmt --all --check"
run = "scripts/manager fmt"

[tasks.clippy]
description = "cargo clippy --all-targets (extra args: mise run clippy -- -- -D warnings)"
run = "scripts/manager clippy"

[tasks.nextest]
description = "cargo nextest run (default project test entry)"
run = "scripts/manager nextest"

[tasks."check-repo-smoke"]
description = "fmt + check-scripts + check-issue-queue (no cargo test)"
run = "scripts/manager check-repo-smoke"

[tasks.manager]
description = "Print script manager help (list all commands)"
run = "scripts/manager help"
