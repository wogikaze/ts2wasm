[package]
name = "ts2wasm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ts2wasm"
path = "src/main.rs"

[lib]
name = "ts2wasm_cli"
path = "src/lib.rs"

[dependencies]
ts2wasm-compiler = { path = "../compiler" }
ts2wasm-frontend = { path = "../frontend" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
ts2wasm-backend-wasm = { path = "../backend-wasm" }
ts2wasm-frontend = { path = "../frontend" }
ts2wasm-ir = { path = "../ir" }
ts2wasm-shared = { path = "../shared" }
