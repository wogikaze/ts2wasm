[package]
name = "ts2wasm-compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ts2wasm_compiler"
path = "src/lib.rs"

[features]
default = []
source-profiler = []

[dependencies]
ts2wasm-frontend = { path = "../frontend" }
ts2wasm-source = { path = "../source" }
ts2wasm-diagnostic = { path = "../diagnostic" }
ts2wasm-syntax = { path = "../syntax" }
ts2wasm-shared = { path = "../shared" }
ts2wasm-ir = { path = "../ir" }
ts2wasm-backend-wasm = { path = "../backend-wasm" }
ts2wasm-semantic-ir = { path = "../semantic-ir" }
ts2wasm-backend-correctness = { path = "../backend-correctness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"

[dev-dependencies]
ts2wasm-runtime-abi = { path = "../runtime-abi" }
