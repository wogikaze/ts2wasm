version: 1
categories:
  semantic: Fixtures that exercise standard JS/TS semantics and produce correct output
  differential: Fixtures verified by comparing Node.js vs ts2wasm/iwasm output
  negative: Fixtures expected to produce compiler diagnostics for invalid input
  type-erasure: Fixtures verifying TypeScript type annotations are erased correctly
  build-smoke: Fixtures tested only for successful compilation, not runtime semantics
  parser: Fixtures testing parser acceptance or rejection
  test-infrastructure: Fixtures that test the test framework itself
