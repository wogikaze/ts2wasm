name: publish-docs

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    env:
      TS2WASM_DOCS_REPO: ${{ vars.TS2WASM_DOCS_REPO }}
      TS2WASM_DOCS_BRANCH: ${{ vars.TS2WASM_DOCS_BRANCH || 'main' }}
      TS2WASM_DOCS_REPO_PATH: ${{ github.workspace }}/docs-repo
      TS2WASM_WEB_UI_DATA_DIR: ${{ github.workspace }}/docs-repo/coverage/web-ui/public/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout public docs repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TS2WASM_DOCS_REPO }}
          path: docs-repo
          token: ${{ secrets.TS2WASM_DOCS_REPO_TOKEN }}
          fetch-depth: 1

      - name: Configure Pages
        run: |
          if [ -z "${TS2WASM_DOCS_REPO}" ]; then
            echo "TS2WASM_DOCS_REPO repository variable is required (owner/repo)." >&2
            echo "Set vars.TS2WASM_DOCS_REPO to your public docs repository." >&2
            exit 1
          fi
          if [ -z "${TS2WASM_DOCS_REPO_TOKEN}" ]; then
            echo "TS2WASM_DOCS_REPO_TOKEN secret is required for pushing docs repo updates." >&2
            exit 1
          fi
        env:
          TS2WASM_DOCS_REPO: ${{ vars.TS2WASM_DOCS_REPO }}
          TS2WASM_DOCS_REPO_TOKEN: ${{ secrets.TS2WASM_DOCS_REPO_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          wget -q https://github.com/bytecodealliance/wasm-micro-runtime/releases/download/WAMR-2.4.3/iwasm-2.4.3-linux-x86_64.tar.gz
          tar -xzf iwasm-2.4.3-linux-x86_64.tar.gz
          sudo mv iwasm /usr/local/bin/
          chmod +x /usr/local/bin/iwasm

      - name: Fetch reference suites
        run: |
          mkdir -p reference
          if [ ! -d reference/test262/.git ]; then
            git clone --depth 1 https://github.com/tc39/test262.git reference/test262
          fi
          if [ ! -d reference/typescript/.git ]; then
            git clone --depth 1 https://github.com/microsoft/TypeScript.git reference/typescript
          fi
          if [ ! -d reference/typescript-go/.git ]; then
            git clone --depth 1 https://github.com/microsoft/typescript-go.git reference/typescript-go
          fi

      - name: Run full reference coverage
        run: |
          ./scripts/manager reference-coverage test262 --jsonl --jobs 4 --dashboard-data
          ./scripts/manager reference-coverage tsc --jobs 4 --dashboard-data
          ./scripts/manager reference-coverage tsgo --jobs 4 --dashboard-data
          ./scripts/manager web-ui-data

      - name: Install dashboard dependencies
        run: |
          npm ci
        working-directory: web-ui

      - name: Build dashboard bundle and copy artifacts
        run: |
          python scripts/build-dashboard-site.py
          python scripts/sync-docs-site.py
        env:
          TS2WASM_DOCS_REPO_PATH: ${{ github.workspace }}/docs-repo
          TS2WASM_WEB_UI_DATA_DIR: ${{ github.workspace }}/docs-repo/coverage/web-ui/public/data
          TS2WASM_DASHBOARD_SRC_DIR: ${{ github.workspace }}/docs-repo/public/dashboard

      - name: Push docs repo
        run: |
          cd docs-repo
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No docs updates to push."
            exit 0
          fi
          git add -A
          git commit -m "chore: sync latest docs and coverage dashboard"
          git push origin "HEAD:${TS2WASM_DOCS_BRANCH}"
        env:
          TS2WASM_DOCS_BRANCH: ${{ env.TS2WASM_DOCS_BRANCH }}
