name: issues-invariants

on:
  pull_request:
    paths:
      - "issues/**"
      - "scripts/check/issue-queue.py"
      - "scripts/gen/update-issue-index.sh"
      - "scripts/manager"
      - ".githooks/pre-commit"
  push:
    branches:
      - master
    paths:
      - "issues/**"
      - "scripts/check/issue-queue.py"
      - "scripts/gen/update-issue-index.sh"
      - "scripts/manager"
  schedule:
    - cron: "17 4 * * 1" # weekly Monday 04:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Issue queue invariants
        run: |
          cd "${GITHUB_WORKSPACE}"
          ./scripts/manager check-issue-queue
