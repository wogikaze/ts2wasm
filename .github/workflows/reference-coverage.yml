name: reference-coverage

on:
  pull_request:
    paths:
      - crates/cli/**
      - scripts/manager
      - scripts/manager.py
      - artifacts/coverage/reference-coverage-matrix.md
      - .github/workflows/reference-coverage.yml
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wabt
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Fetch base branch docs
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          git show origin/${{ github.event.pull_request.base.ref }}:artifacts/coverage/reference-coverage-matrix.md > /tmp/base-coverage-matrix.md || true

      - name: Run coverage matrix check
        run: |
          ./scripts/manager update-coverage-matrix --check

      - name: Run coverage delta gate
        run: |
          ./scripts/manager check-coverage-gate /tmp/base-coverage-matrix.md artifacts/coverage/reference-coverage-matrix.md

  test262-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wabt
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Install iwasm (WAMR)
        run: |
          wget https://github.com/bytecodealliance/wasm-micro-runtime/releases/download/WAMR-2.4.3/iwasm-2.4.3-linux-x86_64.tar.gz
          tar -xzf iwasm-2.4.3-linux-x86_64.tar.gz
          sudo mv iwasm /usr/local/bin/
          chmod +x /usr/local/bin/iwasm

      - name: Check shell scripts
        run: |
          ./scripts/manager check-scripts

      - name: Run test262 runner with sample
        run: |
          ./scripts/manager test262 --sample 50 --jobs 4 | tee test262-results.jsonl | ./scripts/manager test-differential-reporter --html test262-report.html --markdown test262-report.md

      - name: Upload test262 results
        uses: actions/upload-artifact@v4
        with:
          name: test262-results
          path: |
            test262-results.jsonl
            test262-report.html
            test262-report.md

  coverage-ramp:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wabt
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Update coverage matrix (ramp)
        run: |
          ./scripts/manager update-coverage-matrix

      - name: Create pull request if matrix changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: refresh reference coverage matrix"
          title: "docs: refresh reference coverage matrix"
          body: |
            Automated reference coverage refresh.

            - ran scripts/manager update-coverage-matrix
            - advanced per-suite executed limits by ramp step
            - updated artifacts/coverage/reference-coverage-matrix.md
          branch: ci/reference-coverage-ramp
          delete-branch: true
