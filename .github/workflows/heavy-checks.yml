name: heavy-checks

on:
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "scripts/check/fixture-differential.py"
      - "scripts/manager"
      - "scripts/manager.py"
  push:
    branches:
      - master
    paths:
      - "crates/**"
      - "fixtures/**"
      - "scripts/check/fixture-differential.py"
      - "scripts/manager"
      - "scripts/manager.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-tools
        run: |
          cargo install wasm-tools

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install iwasm (WAMR)
        run: |
          wget -q https://github.com/bytecodealliance/wasm-micro-runtime/releases/download/WAMR-2.4.3/iwasm-2.4.3-x86_64-ubuntu-22.04.tar.gz
          tar -xzf iwasm-2.4.3-x86_64-ubuntu-22.04.tar.gz
          sudo mv iwasm /usr/local/bin/
          chmod +x /usr/local/bin/iwasm

      - name: Fixture differential check
        run: |
          cd "${GITHUB_WORKSPACE}"
          ./scripts/manager check-fixture-differential
