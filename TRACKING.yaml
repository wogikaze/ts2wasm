  - id: 349
    title: Convert resolver domain lowering APIs from &mut Resolver to LoweringCtx
      or narrow views
    priority: P1
    type: refactor
    area: ir
    status: open
    created: '2026-05-12'
    updated: '2026-05-12'
    roadmap: P14-final-lowering-boundary
    depends_on:
      - 348
    acceptance:
      - cargo test -p ts2wasm-ir -p ts2wasm-compiler
      - mise run check architecture
      - grep -R "LoweringCtx" crates/ir/src/lowered/resolver
    non_goals:
      - No new syntax support.
      - No runtime behavior change.
    plan:
      goal: 'Domain lowering modules should no longer take the full Resolver when
        only a smaller context is required. Convert array, call, object, class, function,
        string, module, and expr submodules to use LoweringCtx or focused views.

        '
      files:
        - crates/ir/src/lowered/resolver/array.rs
        - crates/ir/src/lowered/resolver/call/**
        - crates/ir/src/lowered/resolver/expr/**
        - crates/ir/src/lowered/resolver/object.rs
        - crates/ir/src/lowered/resolver/class.rs
        - crates/ir/src/lowered/resolver/function.rs
        - crates/ir/src/lowered/resolver/string.rs
        - crates/ir/src/lowered/resolver/module.rs
    notes: 'Physical file splitting is already mostly done. This issue makes the API
      boundary real.

      '
