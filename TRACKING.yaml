  acceptance:
  - cargo test -p ts2wasm-frontend -p ts2wasm-ir -p ts2wasm-backend-wasm -p ts2wasm-compiler -p ts2wasm-cli
  - mise run check architecture 2>&1 | grep -v 'WARN' | grep -c 'function.*lines' | xargs -I{} test {} -lt 10
  non_goals:
  - No change to runtime semantics or wasm output.
  - Function reduction beyond the fewer-than-10-violations target is deferred.
  plan:
    goal: 'Break down known oversized functions and reduce architecture-check function length violations below 10. Preserve
      runtime semantics and emitted wasm output.

      '
