    - crates/backend-wasm/src/statement_emit.rs: emit_statement_with_label already split below 300 lines
    - crates/frontend/src/lexer.rs: Lexer::tokenize already split below 300 lines
    - crates/ir/src/lowered/resolver/array.rs: lower_variable_array_callback_method already split below 300 lines
    - crates/backend-wasm/src/json/emit.rs: break up emit_json_parse
    - crates/backend-wasm/src/runtime_fn_impl.rs: resolve RuntimeFn::spec via
    - remaining architecture-reported oversize functions
  notes: 'P10 hotspot functions emit_expr, Lexer::tokenize, lower_variable_array_callback_method, and emit_statement_with_label
    are already below 300 lines. RuntimeFn::spec is temporarily handled via include!-based spec split and should be cleaned
    up by #274. emit_json_parse remains oversized. 15 other oversize function violations remain across 8 files, so the current
    acceptance criterion is not yet met.

