  acceptance:
    - cargo test -p ts2wasm-backend-wasm -p ts2wasm-compiler -p ts2wasm-cli
    - '! grep -R "ts2wasm_frontend" crates/backend-wasm/src crates/backend-wasm/Cargo.toml'
